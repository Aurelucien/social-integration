[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-social-inbox"
version = "0.2.0"
description = "Local, read-only personal message aggregation and event monitoring for agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
personal-social-inbox = "personal_social_inbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
